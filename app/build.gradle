plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.sniply.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sniply.app'
        minSdk 29
        targetSdk 35
        versionCode (System.getenv('BUILD_NUMBER') ?: '1').toInteger()
        versionName System.getenv('APP_VERSION') ?: '0.1.0-dev'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    if (System.getenv('RELEASE_STORE')) {
        signingConfigs {
            production {
                storeFile file(System.getenv('RELEASE_STORE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.production } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip { install 'yt-dlp' }
    }
}
